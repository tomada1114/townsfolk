name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # `bash` runs as `bash --noprofile --norc -eo pipefail {0}`; an unnamed shell is
    # `bash -e {0}`, which misses a failure before a `|`
    # (scripts/checks/workflow-hygiene.sh).
    shell: bash

jobs:
  analyze:
    name: Analyze Swift
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/select-xcode

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: swift
          build-mode: manual

      - name: Build the package for analysis
        # App/ is a thin @main shell; all logic lives in the local package
        # (docs/architecture.md), so building it covers every analyzable line.
        run: swift build --package-path Packages/TownsfolkKit

      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
