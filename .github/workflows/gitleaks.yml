name: Gitleaks History Scan

# The staged guard (scripts/check-staged.sh) only sees new commits; this scans the
# whole history weekly for credentials that reached it anyway. The pull_request
# trigger runs it on any edit to this file, so a pin bump proves its checksum
# before it merges.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/gitleaks.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # `bash` runs as `bash --noprofile --norc -eo pipefail {0}`; an unnamed shell is
    # `bash -e {0}`, which misses a failure before a `|`
    # (scripts/checks/workflow-hygiene.sh).
    shell: bash

jobs:
  scan:
    name: Scan full git history for leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Bump both together. Renovate (.github/renovate.json) opens the version bump
      # but cannot compute the checksum; the pull_request trigger runs this job on
      # that PR, and it fails the sha256sum step until
      # GITLEAKS_SHA256 is set to the linux_x64 line of the release's
      # gitleaks_<version>_checksums.txt; verify locally with
      # `echo "<sha>  gitleaks_<version>_linux_x64.tar.gz" | shasum -a 256 -c`.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full history
        # --redact keeps any finding's secret value out of the public job log.
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
