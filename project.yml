# XcodeGen manifest — the SOURCE OF TRUTH for the app target.
# Townsfolk.xcodeproj is generated (`just generate`) and gitignored; never hand-edit it.
name: Townsfolk
options:
  bundleIdPrefix: io.github.tomada1114
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  TownsfolkKit:
    path: Packages/TownsfolkKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Townsfolk:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: TownsfolkKit
        product: TownsfolkUI
      # The app shell is the composition root: it is the only target that links the
      # OS adapters (TownsfolkPlatform) and hands them to Core view models as ports.
      - package: TownsfolkKit
        product: TownsfolkPlatform
    # Debug alone reads an xcconfig, because only an xcconfig can `#include?` the
    # optional, uncommitted Config/Local.xcconfig that gives a developer's Debug
    # builds a stable signing identity — which is what keeps a TCC permission grant
    # alive across rebuilds (Config/Debug.xcconfig explains the mechanism). Release
    # is left out on purpose: it takes its signing from this manifest alone, so no
    # local file can reach `just smoke` or the release workflow.
    configFiles:
      Debug: Config/Debug.xcconfig
    # Japanese is declared here, on the app, because its strings ship in TownsfolkCore's
    # resource bundle: the app bundle holds no `ja.lproj` for macOS to count, and the
    # menus macOS provides follow `AppleLanguages` only into a language the app declares
    # (ADR-0007). XcodeGen writes the gitignored App/Info.plist from this block on every
    # generate, and Xcode merges in the keys GENERATE_INFOPLIST_FILE adds. XcodeGen would
    # otherwise write a fixed "1.0" and "1" for the two versions, so they point back at
    # the build settings `just release-prep` sets.
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.tomada1114.Townsfolk
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Townsfolk.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # A target-level setting outranks the target's xcconfig, so Debug's ad-hoc
        # default lives in Config/Debug.xcconfig where Local.xcconfig can override
        # it. Release keeps it here, exactly as before.
        Release:
          CODE_SIGN_IDENTITY: "-"
  TownsfolkLaunchUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [LaunchUITests]
    dependencies:
      - target: Townsfolk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Townsfolk:
    build:
      targets: { Townsfolk: all }
    test:
      targets: [TownsfolkLaunchUITests]
