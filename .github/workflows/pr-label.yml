name: Label PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

permissions: {}

concurrency:
  # A newer push or title edit supersedes the run in progress.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # `bash` runs as `bash --noprofile --norc -eo pipefail {0}`; an unnamed shell is
    # `bash -e {0}`, which misses a failure before a `|`
    # (scripts/checks/workflow-hygiene.sh).
    shell: bash

jobs:
  label:
    name: Label by Conventional Commit type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Read access for the base-SHA checkout below; a private repository refuses
      # the checkout without it.
      contents: read
      pull-requests: write
    steps:
      # The base SHA, never the PR head: a pull request cannot change the script
      # that runs with this job's write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Apply label from PR title type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/label-pr.sh "$PR_NUMBER" "$PR_TITLE"
